# Mock threat-intel seed. Spec: enrichment-05-spec.md §6.
#
# Hygiene (Architecture §7.1, §10.3): external IPs come only from the RFC 5737
# documentation ranges, domains are invented `example-*` names, hashes are random
# hex. Nothing here is a real indicator.
#
# `raw` mirrors VirusTotal's `last_analysis_stats` and OTX's pulse summary so the
# post-POC adapters (Architecture §7.3) populate the same field with genuinely
# similar data and nothing downstream changes.
#
# Verdict/score bands are validated at load (§6.2):
#   malicious 85-100 · suspicious 40-70 · clean 0-10 · unknown 0
version: 1
defaults:
  sources: [mock]

